# Minimal clamd config for the offline demo gateway.
Foreground yes
LogTime yes
LogVerbose no
LogClean no
ExtendedDetectionInfo yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
StreamMaxLength 16M
MaxConnectionQueueLength 200
MaxThreads 10
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
SelfCheck 0
